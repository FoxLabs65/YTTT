# ============================================================
# Trending Content Shorts Engine - Configuration
# ============================================================
# Copy this file to settings.yaml and fill in your API keys.
# settings.yaml is gitignored and will never be committed.
# ============================================================

# --- API Keys ---
pexels_api_key: "YOUR_PEXELS_API_KEY"
pixabay_api_key: "YOUR_PIXABAY_API_KEY"
coverr_api_key: ""  # Optional: free at https://api.coverr.co/docs/ (non-commercial; attribution required)
unsplash_access_key: ""  # Optional: free at https://unsplash.com/developers (attribution required)
anthropic_api_key: "YOUR_ANTHROPIC_API_KEY"
gemini_api_key: ""  # Fallback LLM: free at https://aistudio.google.com/apikey
freesound_api_key: ""  # Optional: free at https://freesound.org/apiv2/apply/ for extra music variety

# --- YouTube OAuth ---
# Place your client_secret.json in this config/ directory.
# token.json is auto-created after first OAuth flow.
youtube_client_secret: "config/client_secret.json"
youtube_token: "config/token.json"

# --- TikTok ---
# Content Posting API requires OAuth. Add client_key/client_secret, then run
# "Connect TikTok" in Setup to authorize your account. Register redirect_uri
# in TikTok Developer Portal: http://localhost:8765/callback
tiktok:
  client_key: "YOUR_TIKTOK_CLIENT_KEY"
  client_secret: "YOUR_TIKTOK_CLIENT_SECRET"
  redirect_uri: "http://localhost:8765/callback"  # Must match TikTok Developer Portal
  enabled: false  # Set true once OAuth complete and developer access approved

# --- Content Discovery ---
discovery:
  youtube_queries:
    - "motivational short"
    - "funny story time"
    - "meme compilation"
    - "breaking news reaction"
    - "life hack"
    - "did you know"
    - "unpopular opinion"
    - "daily motivation"
    - "relatable memes"
    - "storytime funny"
  tiktok_hashtags:
    - "#motivation"
    - "#storytime"
    - "#meme"
    - "#funnyvideos"
    - "#breakingnews"
    - "#foryou"
    - "#viral"
    - "#lifehack"
    - "#didyouknow"
    - "#relatable"
  max_results_per_query: 20
  trend_lookback_hours: 48

# --- Content Ideation ---
ideation:
  claude_model: "claude-sonnet-4-6"
  gemini_model: "gemini-2.0-flash"  # Fallback when Claude is overloaded
  scripts_per_batch: 5
  categories:
    - motivational
    - funny
    - meme
    - news
    - storytime
    - howto
    - pov

# --- Asset Sourcing ---
sourcing:
  pexels_videos_per_script: 5
  pixabay_videos_per_script: 3
  # Provider rotation for variety: "random" | "round_robin" | "weighted"
  provider_rotation: "weighted"
  video_providers: [pexels, pixabay, coverr]  # Enable coverr if API key set
  image_providers: [pexels, pixabay, unsplash, openverse]  # openverse needs no key
  provider_weights:  # For weighted strategy
    pexels: 40
    pixabay: 30
    coverr: 20
    unsplash: 25
    openverse: 15
  music_moods:
    motivational: "uplifting"
    funny: "funny"
    meme: "quirky"
    news: "dramatic"
    storytime: "chill"
    howto: "chill"
    pov: "quirky"
  # Per-category voice (string) or list for random variety within category
  voiceover_voices:
    motivational: "en-US-AndrewMultilingualNeural"
    funny: "en-US-BrianMultilingualNeural"
    meme: "en-US-BrianMultilingualNeural"
    news: "en-US-AndrewMultilingualNeural"
    storytime: "en-US-AvaMultilingualNeural"
    howto: "en-US-AndrewMultilingualNeural"
    pov: "en-US-BrianMultilingualNeural"
  # Optional: pool of voices to rotate through for ALL scripts (overrides per-category)
  # When set, each script gets a random voice from this list for variety
  voiceover_voice_pool: []  # e.g. ["en-US-AndrewMultilingualNeural", "en-US-AvaMultilingualNeural", "en-US-BrianMultilingualNeural", "en-GB-SoniaNeural"]
  voiceover_rate: "-5%"
  music:
    auto_download: true             # Auto-download from YouTube/Freesound when no local track matches
    min_tracks_per_mood: 5          # Minimum tracks to keep per mood category (higher = more variety)
    prefer_local: true              # Prefer manually placed .mp3 files over auto-downloaded

# --- Video Composition ---
composer:
  resolution:
    width: 1080
    height: 1920
  fps: 30
  transition_duration: 0.3
  music_volume: 0.05  # Lowered so music doesn't overpower voiceover (~10% of original)
  font: "segoe-ui-bold"  # Options: segoe-ui-bold, impact, arial-bold, calibri-bold, or a .ttf path
  caption_font_size: 48
  hook_font_size: 72
  watermark_text: ""  # Set your channel name, or leave empty

# --- Upload ---
upload:
  youtube:
    category_id: "22"  # People & Blogs
    privacy_status: "public"
    default_tags:
      - "shorts"
      - "viral"
      - "trending"
    description_footer: |
      Follow for more daily content!
      #Shorts
  tiktok:
    max_caption_length: 2200

# --- Pipeline Retry ---
pipeline:
  max_retries: 3           # Max attempts per phase before giving up
  retry_delays: [30, 60, 120]  # Seconds between retries (escalating backoff)
  ideation_bonus_retry: true   # Extra retry round for ideation when 0 scripts produced

# --- YouTube Reaction Shorts (optional; human-in-the-loop) ---
# DISCLAIMER: Downloading YouTube content may violate ToS. Use at your own risk.
reaction:
  enabled: false  # Set true to enable reaction discovery in pipeline
  allowed_categories: [gaming, podcast, entertainment, comedy, education]
  max_candidates_per_run: 15

# --- Scheduler ---
scheduler:
  discovery_time: "06:00"
  ideation_time: "06:30"
  sourcing_time: "07:00"
  composing_time: "07:30"
  cleanup_time: "08:00"
  notification_time: "08:30"
  timezone: "Europe/London"
  videos_per_run: 5
